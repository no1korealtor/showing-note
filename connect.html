<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>스마트폰 연결 안내</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Pretendard", sans-serif; background: #0f172a; color: white; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 20px; text-align: center; }
    .card { background: #1e293b; border-radius: 20px; padding: 36px 30px; max-width: 460px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border: 1px solid #334155; }
    h1 { font-size: 22px; margin-bottom: 8px; color: #38bdf8; }
    p { color: #94a3b8; font-size: 14px; margin-bottom: 20px; line-height: 1.5; }
    .qr-wrap { background: white; padding: 16px; border-radius: 16px; display: inline-block; margin-bottom: 20px; }
    .qr-img { width: 220px; height: 220px; display: block; }
    .url-box { background: #0f172a; padding: 12px 16px; border-radius: 10px; font-family: monospace; font-size: 18px; color: #38bdf8; font-weight: 700; margin-bottom: 20px; border: 1px solid #334155; }
    .steps { text-align: left; background: #0f172a; border-radius: 12px; padding: 16px; font-size: 13px; color: #cbd5e1; line-height: 1.7; }
    .steps ol { padding-left: 18px; margin: 0; }
    .btn-pc { display: inline-block; margin-top: 20px; background: #2563eb; color: white; text-decoration: none; padding: 12px 24px; border-radius: 10px; font-weight: 700; font-size: 14px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>📱 스마트폰으로 쇼잉수첩 열기</h1>
    <p>스마트폰 기본 <b>카메라 앱</b>을 켜서<br>아래 QR코드를 비추면 즉시 열립니다!</p>

    <div class="qr-wrap">
      <img id="qrImg" class="qr-img" alt="QR Code" src="https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=http://192.168.0.6:8088/">
    </div>

    <div class="url-box" id="urlText">http://192.168.0.6:8088/</div>

    <div class="steps">
      <ol>
        <li>스마트폰이 사무실 <b>와이파이(Wi-Fi)</b>에 연결되어 있는지 확인합니다.</li>
        <li>스마트폰 <b>카메라</b>로 위 QR코드를 비추거나, 인터넷 창에 위 주소를 직접 입력합니다.</li>
        <li>화면 하단(또는 상단 더보기 <b>⋮</b>)에서 <b>[홈 화면에 추가]</b>를 누르시면 스마트폰 바탕화면에 일반 앱처럼 아이콘이 생깁니다!</li>
      </ol>
    </div>

    <a href="/index.html" class="btn-pc">🖥️ PC 화면에서 지금 바로 쓰기</a>
  </div>

  <script>
    // Automatically match IP
    const currentHost = window.location.hostname || '192.168.0.6';
    const targetUrl = `http://${currentHost}:8088/index.html`;
    document.getElementById('urlText').textContent = targetUrl;
    document.getElementById('qrImg').src = `https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=${encodeURIComponent(targetUrl)}`;
  </script>
</body>
</html>
