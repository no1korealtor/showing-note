<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>쇼잉수첩 데이터 무결성 TDD 테스트 러너</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Pretendard", sans-serif; background: #0f172a; color: white; padding: 24px; line-height: 1.6; }
    h1 { font-size: 22px; color: #38bdf8; margin-bottom: 16px; }
    .summary { font-size: 16px; margin-bottom: 20px; padding: 12px 16px; border-radius: 8px; font-weight: 700; }
    .summary.pass { background: #065f46; color: #34d399; }
    .summary.fail { background: #7f1d1d; color: #f87171; }
    .test-box { background: #1e293b; border-radius: 8px; padding: 12px 16px; margin-bottom: 8px; border-left: 4px solid #64748b; }
    .test-box.pass { border-color: #10b981; }
    .test-box.fail { border-color: #ef4444; }
    .test-title { font-weight: 700; font-size: 14px; }
    .test-desc { font-size: 12px; color: #94a3b8; margin-top: 4px; }
    .test-error { font-size: 12px; color: #f87171; margin-top: 6px; font-family: monospace; }
  </style>
</head>
<body>
  <h1>🛡️ 중개사 자산 데이터 무결성 & 안정성 TDD 검증기</h1>
  <div id="summary" class="summary">테스트 실행 중...</div>
  <div id="results"></div>

  <script>
    /* In-memory mock storage for isolated TDD tests */
    class MockStorage {
      constructor() { this.store = {}; }
      getItem(key) { return this.store[key] || null; }
      setItem(key, val) { this.store[key] = String(val); }
      removeItem(key) { delete this.store[key]; }
      clear() { this.store = {}; }
    }

    /* Core Data Manager Under Test */
    class ShowingDataManager {
      constructor(storage = new MockStorage()) {
        this.storage = storage;
        this.VERSION = '1.1.0';
        this.KEY_SETTINGS = 'showing_diary_settings';
        this.KEY_PROPERTIES = 'showing_diary_properties';
        this.KEY_SHOWINGS = 'showing_diary_showings';
        this.KEY_SNAPSHOTS = 'showing_diary_snapshots';
      }

      getProperties() {
        try {
          return JSON.parse(this.storage.getItem(this.KEY_PROPERTIES) || '[]');
        } catch(e) { return []; }
      }

      getShowings() {
        try {
          return JSON.parse(this.storage.getItem(this.KEY_SHOWINGS) || '[]');
        } catch(e) { return []; }
      }

      save(properties, showings, createSnapshot = true) {
        if (createSnapshot) {
          this.pushSnapshot();
        }
        this.storage.setItem(this.KEY_PROPERTIES, JSON.stringify(properties));
        this.storage.setItem(this.KEY_SHOWINGS, JSON.stringify(showings));
      }

      pushSnapshot() {
        try {
          const snaps = JSON.parse(this.storage.getItem(this.KEY_SNAPSHOTS) || '[]');
          const current = {
            timestamp: new Date().toISOString(),
            properties: this.getProperties(),
            showings: this.getShowings()
          };
          snaps.unshift(current);
          // Keep only last 5 snapshots to protect storage
          if (snaps.length > 5) snaps.length = 5;
          this.storage.setItem(this.KEY_SNAPSHOTS, JSON.stringify(snaps));
        } catch(e){}
      }

      rollbackSnapshot(index = 0) {
        try {
          const snaps = JSON.parse(this.storage.getItem(this.KEY_SNAPSHOTS) || '[]');
          if (snaps[index]) {
            this.storage.setItem(this.KEY_PROPERTIES, JSON.stringify(snaps[index].properties));
            this.storage.setItem(this.KEY_SHOWINGS, JSON.stringify(snaps[index].showings));
            return true;
          }
        } catch(e){}
        return false;
      }

      addProperty(prop) {
        const props = this.getProperties();
        const newProp = {
          id: prop.id || 'prop-' + Date.now(),
          dong: prop.dong || '성산동',
          jibun: prop.jibun || '',
          ho: prop.ho || '',
          building: prop.building || '',
          doorPw: prop.doorPw || '',
          commonPw: prop.commonPw || '',
          ownerName: prop.ownerName || '',
          ownerPhone: prop.ownerPhone || '',
          createdAt: new Date().toISOString()
        };
        props.unshift(newProp);
        this.save(props, this.getShowings());
        return newProp;
      }

      updateProperty(id, updateData) {
        const props = this.getProperties();
        const p = props.find(item => item.id === id);
        if (!p) throw new Error('Property not found');
        Object.assign(p, updateData);
        this.save(props, this.getShowings());
        return p;
      }

      deleteProperty(id) {
        let props = this.getProperties();
        let shows = this.getShowings();
        props = props.filter(item => item.id !== id);
        shows = shows.filter(item => item.propertyId !== id);
        this.save(props, shows);
      }

      addShowing(showing) {
        const shows = this.getShowings();
        let clientName = showing.clientName || '';
        if (!clientName) {
          const phone = showing.clientPhone || '';
          const digits = phone.replace(/\D/g, '');
          clientName = digits.length >= 4 ? `손님 (${digits.slice(-4)})` : '방문 손님';
        }

        const newShow = {
          id: showing.id || 'show-' + Date.now(),
          propertyId: showing.propertyId,
          date: showing.date,
          time: showing.time || '14:00',
          clientPhone: showing.clientPhone || '',
          clientName,
          memo: showing.memo || '',
          feedback: showing.feedback || '',
          status: showing.status || 'pending'
        };
        shows.push(newShow);
        this.save(this.getProperties(), shows);
        return newShow;
      }

      /* Schema Migration & Auto-Healing */
      migrateAndHeal(data) {
        if (!data || typeof data !== 'object') throw new Error('Invalid backup data');
        const properties = (data.properties || []).map(p => ({
          id: p.id || 'prop-' + Math.random().toString(36).substr(2, 9),
          dong: p.dong || '기본동',
          jibun: p.jibun || '미상',
          ho: p.ho || '',
          building: p.building || p.buildingName || '',
          doorPw: p.doorPw || '',
          commonPw: p.commonPw || '',
          ownerName: p.ownerName || '',
          ownerPhone: p.ownerPhone || ''
        }));

        const showings = (data.showings || []).map(s => ({
          id: s.id || 'show-' + Math.random().toString(36).substr(2, 9),
          propertyId: s.propertyId,
          date: s.date || '2026-01-01',
          time: s.time || '14:00',
          clientPhone: s.clientPhone || '',
          clientName: s.clientName || '손님',
          memo: s.memo || '',
          feedback: s.feedback || ''
        }));

        return { properties, showings };
      }
    }

    /* Test Runner */
    const tests = [
      {
        name: 'TDD-1: 새 물건지(주소, 비번, 임대인) 등록 및 무결성 검증',
        fn: () => {
          const dm = new ShowingDataManager();
          const p = dm.addProperty({ dong: '성산동', jibun: '234-12', ho: '201호', doorPw: '1234*', ownerPhone: '010-1111-2222' });
          const list = dm.getProperties();
          if (list.length !== 1) throw new Error('등록된 매물 수가 1이어야 합니다.');
          if (list[0].jibun !== '234-12' || list[0].doorPw !== '1234*') throw new Error('데이터 필드가 일치하지 않습니다.');
        }
      },
      {
        name: 'TDD-2: 물건지 정보 수정 시 기존 쇼잉 히스토리 100% 보존 검증',
        fn: () => {
          const dm = new ShowingDataManager();
          const p = dm.addProperty({ dong: '중동', jibun: '100-1', ho: '301호' });
          dm.addShowing({ propertyId: p.id, date: '2026-10-25', time: '14:00', clientPhone: '010-9999-8888' });

          // 비번 및 호수 수정
          dm.updateProperty(p.id, { ho: '302호', doorPw: '9988#' });

          const updated = dm.getProperties()[0];
          const shows = dm.getShowings();
          if (updated.ho !== '302호' || updated.doorPw !== '9988#') throw new Error('수정 내용 반영 실패');
          if (shows.length !== 1 || shows[0].propertyId !== p.id) throw new Error('기존 쇼잉 이력이 유실되었습니다!');
        }
      },
      {
        name: 'TDD-3: 손님 이름 미입력 시 전화번호 뒷자리로 자동 명명 검증',
        fn: () => {
          const dm = new ShowingDataManager();
          const p = dm.addProperty({ dong: '성산동', jibun: '55-1' });
          const s = dm.addShowing({ propertyId: p.id, date: '2026-10-23', clientPhone: '010-3456-7890' });
          if (s.clientName !== '손님 (7890)') throw new Error(`예상: 손님 (7890), 실제: ${s.clientName}`);
        }
      },
      {
        name: 'TDD-4: 자동 스냅샷 롤링 백업 및 복원(Rollback) 검증 (데이터 자산 보호)',
        fn: () => {
          const dm = new ShowingDataManager();
          dm.addProperty({ dong: '성산동', jibun: '111-1' });
          dm.addProperty({ dong: '성산동', jibun: '222-2' });

          // 실수로 전부 삭제됨을 시뮬레이션
          const props = dm.getProperties();
          dm.deleteProperty(props[0].id);
          dm.deleteProperty(props[1].id);
          if (dm.getProperties().length !== 0) throw new Error('삭제 시뮬레이션 실패');

          // 스냅샷으로 긴급 롤백
          const ok = dm.rollbackSnapshot(1);
          if (!ok) throw new Error('스냅샷 롤백 실패');
          if (dm.getProperties().length < 1) throw new Error('롤백 후 데이터가 복원되지 않았습니다!');
        }
      },
      {
        name: 'TDD-5: 구버전(v1.0) 데이터에서 신버전 마이그레이션 호환성 검증',
        fn: () => {
          const dm = new ShowingDataManager();
          // buildingName 같은 옛날 필드명이 있는 레거시 데이터
          const legacyBackup = {
            properties: [
              { dong: '중동', jibun: '77-1', buildingName: '옛날빌라', doorPw: '1111' }
            ],
            showings: [
              { propertyId: 'legacy-1', date: '2026-10-01', clientName: '직방' }
            ]
          };
          const healed = dm.migrateAndHeal(legacyBackup);
          if (healed.properties[0].building !== '옛날빌라') throw new Error('buildingName -> building 필드 매핑 실패');
          if (!healed.properties[0].id) throw new Error('누락된 ID 자동 생성 실패');
        }
      },
      {
        name: 'TDD-6: 일정 정렬 알고리즘 검증 (가장 빠른 일정 물건지가 맨 위로)',
        fn: () => {
          const today = '2026-10-23';
          const p1 = { id: 'p1', dong: '성산동', jibun: '10' }; // 16:00
          const p2 = { id: 'p2', dong: '중동', jibun: '20' };   // 14:00 (더 빠름!)
          const showings = [
            { propertyId: 'p1', date: today, time: '16:00' },
            { propertyId: 'p2', date: today, time: '14:00' }
          ];
          const sorted = [p1, p2].sort((a, b) => {
            const aUp = showings.find(s => s.propertyId === a.id);
            const bUp = showings.find(s => s.propertyId === b.id);
            return (aUp.date + aUp.time).localeCompare(bUp.date + bUp.time);
          });
          if (sorted[0].id !== 'p2') throw new Error('14:00 약속이 있는 p2가 1등으로 정렬되어야 합니다.');
        }
      }
    ];

    /* Run */
    let passedCount = 0;
    const resultsContainer = document.getElementById('results');

    tests.forEach((t, i) => {
      let isPass = true;
      let errMsg = '';
      try {
        t.fn();
        passedCount++;
      } catch(e) {
        isPass = false;
        errMsg = e.message;
      }

      const box = document.createElement('div');
      box.className = `test-box ${isPass ? 'pass' : 'fail'}`;
      box.innerHTML = `
        <div class="test-title">${isPass ? '✅ PASS' : '❌ FAIL'}: ${t.name}</div>
        ${errMsg ? `<div class="test-error">${errMsg}</div>` : ''}
      `;
      resultsContainer.appendChild(box);
    });

    const summary = document.getElementById('summary');
    if (passedCount === tests.length) {
      summary.className = 'summary pass';
      summary.textContent = `🎉 모든 데이터 무결성 TDD 검증 통과! (${passedCount}/${tests.length}) - 공인중개사 자산 100% 보호 확인됨`;
    } else {
      summary.className = 'summary fail';
      summary.textContent = `⚠️ 일부 검증 실패: ${passedCount}/${tests.length}`;
    }
  </script>
</body>
</html>
